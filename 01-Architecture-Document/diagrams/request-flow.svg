<svg xmlns="http://www.w3.org/2000/svg" style="background:#fff;font-family:-apple-system,Arial,sans-serif" viewBox="0 0 900 735" role="img" aria-label="Sequence diagram of DNS, TCP, TLS and HTTP exchanges between client, DNS server, edge and backend">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <style>
    .hd{font:600 13.5px -apple-system,Arial,sans-serif;fill:#1b2430}
    .hm{font:11.5px Menlo,monospace;fill:#5b6676}
    .life{stroke:#9aa5b4;stroke-width:1.4;stroke-dasharray:4 4}
    .msg{font:12.5px -apple-system,Arial,sans-serif;fill:#1b2430}
    .tm{font:11px Menlo,monospace;fill:#5b6676}
    .lb{font:700 11px -apple-system,Arial,sans-serif;fill:#fff}
  </style>
  <!-- headers -->
  <rect x="40" y="10" width="170" height="52" rx="8" fill="#f3f6f9" stroke="#1b2430"/>
  <text class="hd" x="125" y="32" text-anchor="middle">Client · Mac 4</text><text class="hm" x="125" y="50" text-anchor="middle">10.7.8.144</text>
  <rect x="255" y="10" width="170" height="52" rx="8" fill="#f3f6f9" stroke="#1b2430"/>
  <text class="hd" x="340" y="32" text-anchor="middle">DNS · Mac 1</text><text class="hm" x="340" y="50" text-anchor="middle">10.7.6.171:53</text>
  <rect x="475" y="10" width="170" height="52" rx="8" fill="#f3f6f9" stroke="#1b2430"/>
  <text class="hd" x="560" y="32" text-anchor="middle">Edge · Mac 2</text><text class="hm" x="560" y="50" text-anchor="middle">10.7.20.28:443</text>
  <rect x="680" y="10" width="215" height="52" rx="8" fill="#f3f6f9" stroke="#1b2430"/>
  <text class="hd" x="787" y="32" text-anchor="middle">Backend A or B</text><text class="hm" x="787" y="50" text-anchor="middle">Mac 3:3001 / Mac 4:3002</text>
  <line class="life" x1="125" y1="62" x2="125" y2="725"/><line class="life" x1="340" y1="62" x2="340" y2="725"/>
  <line class="life" x1="560" y1="62" x2="560" y2="725"/><line class="life" x1="790" y1="62" x2="790" y2="725"/>
  <!-- layer bands -->
  <rect x="2" y="80" width="26" height="92" rx="4" fill="#2563eb"/><text class="lb" transform="translate(19,126) rotate(-90)" text-anchor="middle">DNS</text>
  <rect x="2" y="188" width="26" height="132" rx="4" fill="#b45309"/><text class="lb" transform="translate(19,254) rotate(-90)" text-anchor="middle">TCP</text>
  <rect x="2" y="336" width="26" height="174" rx="4" fill="#7c3aed"/><text class="lb" transform="translate(19,423) rotate(-90)" text-anchor="middle">TLS</text>
  <rect x="2" y="526" width="26" height="196" rx="4" fill="#15803d"/><text class="lb" transform="translate(19,624) rotate(-90)" text-anchor="middle">HTTP</text>
  <!-- DNS -->
  <line x1="125" y1="110" x2="338" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="102">① Query A app.team1.test (UDP)</text><text class="tm" x="352" y="114">2.7526</text>
  <line x1="340" y1="155" x2="127" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="147">② A 10.7.20.28, TTL 30, flag aa</text><text class="tm" x="352" y="159">2.7598 (+7 ms)</text>
  <!-- TCP -->
  <line x1="125" y1="215" x2="558" y2="215" stroke="#b45309" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="207">③ SYN  64222 → 443, Seq=0, MSS 1460, WS 64, SACK_PERM</text><text class="tm" x="572" y="219">2.7614</text>
  <line x1="560" y1="260" x2="127" y2="260" stroke="#b45309" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="252">④ SYN-ACK  443 → 64222, Seq=0, Ack=1</text><text class="tm" x="572" y="264">2.8142 (RTT ≈ 53 ms)</text>
  <line x1="125" y1="303" x2="558" y2="303" stroke="#b45309" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="295">⑤ ACK  Seq=1, Ack=1 — connection established</text>
  <!-- TLS -->
  <line x1="125" y1="362" x2="558" y2="362" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="354">⑥ ClientHello — SNI = app.team1.test, cipher list</text><text class="tm" x="572" y="366">2.8158</text>
  <line x1="560" y1="405" x2="127" y2="405" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="397">⑦ ServerHello · Certificate · ServerKeyExchange · Done</text><text class="tm" x="572" y="409">2.8245</text>
  <line x1="125" y1="448" x2="558" y2="448" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="440">⑧ ClientKeyExchange · ChangeCipherSpec · Finished</text><text class="tm" x="572" y="452">2.8263</text>
  <line x1="560" y1="491" x2="127" y2="491" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="483">⑨ ChangeCipherSpec · Finished (keys agreed)</text><text class="tm" x="572" y="495">2.8331</text>
  <!-- HTTP -->
  <line x1="125" y1="552" x2="558" y2="552" stroke="#15803d" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="544">⑩ GET /api/status — encrypted Application Data</text><text class="tm" x="572" y="556">2.8334</text>
  <line x1="560" y1="600" x2="788" y2="600" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <text class="msg" x="570" y="582">⑪ new TCP conn, plain HTTP GET</text><text class="msg" x="570" y="595">+ X-Forwarded-For: 10.7.8.144</text>
  <line x1="790" y1="645" x2="562" y2="645" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <text class="msg" x="570" y="637">⑫ 200 OK, X-Backend: B (JSON)</text>
  <line x1="560" y1="695" x2="127" y2="695" stroke="#15803d" stroke-width="2" marker-end="url(#a2)"/>
  <text class="msg" x="135" y="687">⑬ 200 OK + X-Edge, X-Upstream-Addr — encrypted Application Data</text><text class="tm" x="572" y="699">2.8882</text>
</svg>