<svg xmlns="http://www.w3.org/2000/svg" style="background:#fff;font-family:-apple-system,Arial,sans-serif" viewBox="0 0 900 470" role="img" aria-label="Topology: four Macs connected over Wi-Fi to the college access point and gateway">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#1b2430;stroke-width:1.6;rx:10}
    .ap{fill:#f3f6f9;stroke:#1b2430;stroke-width:1.6}
    .t{font:600 15px -apple-system,Arial,sans-serif;fill:#1b2430}
    .s{font:12.5px -apple-system,Arial,sans-serif;fill:#1b2430}
    .m{font:12px Menlo,monospace;fill:#5b6676}
    .wifi{stroke:#5b6676;stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round}
    .flow{stroke:#0f766e;stroke-width:2.2;fill:none}
    .fl{font:600 12px -apple-system,Arial,sans-serif;fill:#0f766e}
  </style>
  <!-- Wi-Fi links -->
  <line class="wifi" x1="300" y1="120" x2="390" y2="215"/>
  <line class="wifi" x1="600" y1="120" x2="510" y2="215"/>
  <line class="wifi" x1="300" y1="350" x2="390" y2="255"/>
  <line class="wifi" x1="600" y1="350" x2="510" y2="255"/>
  <!-- AP -->
  <rect class="ap" x="360" y="195" width="180" height="80" rx="40"/>
  <text class="t" x="450" y="225" text-anchor="middle">College Wi-Fi</text>
  <text class="m" x="450" y="244" text-anchor="middle">10.7.0.0/19</text>
  <text class="m" x="450" y="260" text-anchor="middle">gateway 10.7.0.1</text>
  <!-- top-left: Mac 4 (client + Backend B) -->
  <rect class="box" x="20" y="20" width="290" height="115"/>
  <text class="t" x="36" y="46">Mac 4 · Backend B + client</text>
  <text class="m" x="36" y="68">10.7.8.144 · en0</text>
  <text class="s" x="36" y="90">Python REST API · TCP 3002</text>
  <text class="s" x="36" y="110">app server instance B (≈ EC2)</text>
  <!-- top-right: Mac 1 (DNS) -->
  <rect class="box" x="590" y="20" width="290" height="115"/>
  <text class="t" x="606" y="46">Mac 1 · Private DNS + client</text>
  <text class="m" x="606" y="68">10.7.6.171 · en0</text>
  <text class="s" x="606" y="90">dnsmasq 2.93 · UDP/TCP 53</text>
  <text class="s" x="606" y="110">zone team1.test (≈ Route 53)</text>
  <!-- bottom-left: Mac 2 (edge) -->
  <rect class="box" x="20" y="335" width="290" height="115"/>
  <text class="t" x="36" y="361">Mac 2 · Edge (TLS + LB)</text>
  <text class="m" x="36" y="383">10.7.20.28 · en0</text>
  <text class="s" x="36" y="405">nginx 1.31.6 · TCP 443 (80→301)</text>
  <text class="s" x="36" y="425">reverse proxy (≈ AWS ALB)</text>
  <!-- bottom-right: Mac 3 (Backend A) -->
  <rect class="box" x="590" y="335" width="290" height="115"/>
  <text class="t" x="606" y="361">Mac 3 · Backend A</text>
  <text class="m" x="606" y="383">10.7.20.243 · en0</text>
  <text class="s" x="606" y="405">Python REST API · TCP 3001</text>
  <text class="s" x="606" y="425">app server instance A (≈ EC2)</text>
  <!-- logical flows -->
  <line class="flow" x1="310" y1="62" x2="586" y2="62" marker-end="url(#ah)" stroke-dasharray="7 5"/>
  <text class="fl" x="448" y="52" text-anchor="middle">① DNS query (UDP 53)</text>
  <line class="flow" x1="105" y1="135" x2="105" y2="331" marker-end="url(#ah)"/>
  <text class="fl" x="97" y="240" text-anchor="end">② HTTPS</text><text class="fl" x="97" y="256" text-anchor="end">:443</text>
  <line class="flow" x1="230" y1="335" x2="230" y2="139" marker-end="url(#ah)"/>
  <text class="fl" x="238" y="240">③ HTTP</text><text class="fl" x="238" y="256">:3002</text>
  <line class="flow" x1="310" y1="425" x2="586" y2="425" marker-end="url(#ah)"/>
  <text class="fl" x="448" y="416" text-anchor="middle">③ HTTP :3001</text>
</svg>