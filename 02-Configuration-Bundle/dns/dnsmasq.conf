# ---------------------------------------------------------------
# dnsmasq config for team1.test  (generated by cn-project/dns/setup-dns.sh)
# ---------------------------------------------------------------

# Names that are NOT ours are forwarded upstream, so the other Macs' internet keeps working.
# Upstream = whatever DNS this Mac got from the Wi-Fi (read from /etc/resolv.conf; Mac 1's own
# DNS setting is never changed, so there is no loop), plus 8.8.8.8 as an extra.
resolv-file=/etc/resolv.conf
server=8.8.8.8
domain-needed
bogus-priv

# Our private zone: answer team1.test ourselves, never forward it upstream
local=/team1.test/

# --- Service records (clients only ever use these names) ---
host-record=app.team1.test,10.7.20.28
host-record=api.team1.test,10.7.20.28

# --- Infrastructure names (handy for the topology / inventory) ---
host-record=dns1.team1.test,10.7.6.171
host-record=edge.team1.test,10.7.20.28
host-record=backend-a.team1.test,10.7.20.243
host-record=backend-b.team1.test,10.7.8.144

# TTL (seconds): how long clients may cache our answers
local-ttl=30

# Log every query (evidence for the report)
log-queries
log-facility=/opt/homebrew/var/log/dnsmasq.log
