# ---------------------------------------------------------------
# team1 edge: TLS termination + reverse proxy + load balancer (edge-mac2)
# Generated by cn-project/edge/setup-nginx.sh
# ---------------------------------------------------------------

# Access log that also records WHICH backend served each request
log_format team1_lb '$remote_addr [$time_local] "$request" $status '
                      'upstream=$upstream_addr upstream_status=$upstream_status rt=$request_time';

# The backend pool. No algorithm line = round robin (A, B, A, B ...).
# Replace with "least_conn;" to explain another strategy.
# max_fails/fail_timeout = passive health check: after 1 failed attempt the server is
# skipped for 10s, then retried.
upstream team1_backends {
    server 10.7.1.112:3001 max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
    server 10.7.2.240:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
}

# Plain HTTP -> redirect to HTTPS
server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

# HTTPS entry point (TLS terminates here; backends receive plain HTTP)
server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     /opt/homebrew/etc/nginx/team-certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/team-certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/team1_access.log team1_lb;

    # Evidence headers: which edge answered, which backend address(es) were tried
    add_header X-Edge          edge-mac2 always;
    add_header X-Upstream-Addr $upstream_addr always;

    location / {
        proxy_pass http://team1_backends;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast and retry the other backend if one is down
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;
    }
}
